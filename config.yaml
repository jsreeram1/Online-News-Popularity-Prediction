paths:
  raw_data: "data/mini_project_1_data.csv"
  processed_data: "data/processed_news.csv"
  model_output: "models/best_popularity_model.joblib"
  preprocessor_output: "models/fitted_preprocessor.joblib"
  metrics_output: "models/evaluation_metrics.json"
  reports_dir: "reports"
  logs_dir: "logs"

logging:
  level: "INFO"
  log_to_file: true

data:
  target_col: "shares"
  id_col: "ID"
  url_col: "URL"
  drop_cols:
    - "ID"
    - "URL"
    - "timedelta"
  numeric_cols:
    - "n_tokens_title"
    - "n_tokens_content"
    - "n_unique_tokens"
    - "n_non_stop_words"
    - "n_non_stop_unique_tokens"
    - "num_hrefs"
    - "num_self_hrefs"
    - "num_imgs"
    - "num_videos"
    - "n_comments"
    - "average_token_length"
    - "self_reference_min_shares"
    - "self_reference_max_shares"
    - "self_reference_avg_shares"
    - "num_keywords"
    - "kw_min_min"
    - "kw_max_min"
    - "kw_avg_min"
    - "kw_min_max"
    - "kw_max_max"
    - "kw_avg_max"
    - "kw_min_avg"
    - "kw_max_avg"
    - "kw_avg_avg"
  categorical_cols:
    - "weekday"
    - "data_channel"

training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  primary_metric: "neg_root_mean_squared_error"
  log_transform_target: true

models:
  DummyBaseline:
    enabled: true
    params:
      regressor__strategy:
        - "median"
  RidgeRegression:
    enabled: true
    params:
      regressor__alpha:
        - 1.0
        - 10.0
        - 100.0
  RandomForest:
    enabled: true
    params:
      regressor__n_estimators:
        - 100
        - 200
      regressor__max_depth:
        - 10
        - 20
      regressor__min_samples_split:
        - 2
        - 5
  GradientBoosting:
    enabled: true
    params:
      regressor__n_estimators:
        - 100
        - 200
      regressor__learning_rate:
        - 0.05
        - 0.1
      regressor__max_depth:
        - 3
        - 5
  HistGradientBoosting:
    enabled: true
    params:
      regressor__max_iter:
        - 100
        - 200
      regressor__learning_rate:
        - 0.05
        - 0.1
      regressor__max_depth:
        - 6
        - 12

